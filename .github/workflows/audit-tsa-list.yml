name: Audit TSA trust list

# Upstream drift watch for the vendored C2PA TSA Trust List
# (verifier/trust-sources/c2pa-tsa/). A TSA added upstream isn't trusted here
# until a refresh; one removed upstream still is. Companion to
# audit-trust-anchors.yml, which watches anchor expiry, not upstream changes.
#
# Script exit codes: 2 = vendored PEM unreadable, 3 = drift, 4 = the check
# could not reach or parse upstream. Any non-zero opens or comments on the
# tracking issue; the script's own output says which case and what to do.
#
# No pull_request trigger: the result depends on a third-party repo and the
# network, not on the PR. Check a refresh branch with `make verify-tsa-list`.

on:
  schedule:
    - cron: '0 16 * * MON'   # Mondays 16:00 UTC (offset from the other audits)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  # Global group (no ref qualifier) on purpose: serializes the issue-writing
  # runs so two concurrent failures can't open duplicate tracking issues.
  group: audit-tsa-list
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'   # match this repo's other workflows (ci.yml)

      # Root install: the verifier workspace has no lockfile of its own.
      - name: Install deps (monorepo root)
        run: npm ci

      - name: Run TSA trust-list drift check
        id: audit
        continue-on-error: true
        working-directory: verifier
        shell: bash
        run: |
          set -o pipefail
          npx tsx scripts/audit-tsa-list.ts 2>&1 | tee /tmp/audit-output.txt
          exit "${PIPESTATUS[0]}"

      - name: Ensure tracking labels exist
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const labels = [
              { name: 'tsa-trust-list', color: 'D93F0B', description: 'C2PA TSA Trust List upstream drift' },
              { name: 'audit', color: 'BFDADC', description: 'Automated audit findings' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, ...label });
              }
            }

      - name: Open or comment on tracking issue
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/audit-output.txt', 'utf-8');
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '`make verify-tsa-list` reported a non-zero exit.',
              '', '```', output.trim(), '```', '',
              `Run: ${runUrl}`, '',
              'Close this issue once `make verify-tsa-list` exits 0 on `main`.',
            ].join('\n');
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, labels: 'tsa-trust-list', state: 'open',
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, body: `Audit re-run on ${today}:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `TSA trust list audit: action required (${today})`,
                labels: ['tsa-trust-list', 'audit'], body,
              });
            }
