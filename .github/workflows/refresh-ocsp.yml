# Refreshes the pre-signed OCSP responses served at http://ocsp.realreel.xyz.
#
# Daily cadence against a 7-day nextUpdate window (OCSP_VALIDITY_DAYS in
# ocsp/build-ocsp-responses.ts), so ~6 missed runs still leave valid responses
# in KV. A failed run opens/updates a tracking issue (same ritual as
# audit-trust-anchors.yml) — and the audit workflow independently watches the
# responder cert's own expiry.
#
# Auth: Workload Identity Federation (no long-lived GCP key in GitHub). The
# ocsp-refresh service account holds roles/cloudkms.signer on the
# realreel-ocsp-root key ONLY — see ocsp/README.md for the one-time GCP and
# repo-secret setup.
#
# Status is STICKY: an explicit dispatch persists it to the `ica-status` key
# in the same KV namespace as the responses, and every scheduled run re-signs
# that persisted status. So an ICA compromise (CP §3.6, revoke ≤ 72 h) is one
# dispatch with status=revoked — the daily cron then keeps publishing
# `revoked` with fresh validity windows instead of silently reverting to
# `good`. Restoring `good` likewise requires an explicit status=good dispatch.
#
# The steps are thin wrappers: status resolve/persist and the live-endpoint
# check live in ocsp/refresh-ops.ts (typed + unit-tested); openssl stays
# inline as the independent cross-check of the built responses. Actions are
# SHA-pinned (this job holds a signing credential); actionlint runs in ci.yml.

name: Refresh OCSP responses

on:
  schedule:
    - cron: '17 6 * * *'   # daily 06:17 UTC
  workflow_dispatch:
    inputs:
      status:
        description: >-
          Certificate status to publish for the ICA (inherit = re-sign the
          currently persisted status; an explicit good/revoked is persisted
          for all future scheduled runs)
        type: choice
        options: [inherit, good, revoked]
        default: inherit
      revocation_time:
        description: 'ISO-8601 revocation time (required when status=revoked)'
        type: string
        required: false
      revocation_reason:
        description: 'CRLReason integer 0..10 (optional; 1 = keyCompromise)'
        type: string
        required: false

permissions:
  contents: read
  id-token: write   # Workload Identity Federation token exchange
  issues: write     # failure tracking issue

concurrency:
  # Global group: serializes runs so a manual revocation dispatch can't race a
  # scheduled refresh mid-flight.
  group: refresh-ocsp
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      # Inputs flow through env + step outputs only — no ${{ }} interpolation
      # inside run: bodies (script-injection hygiene).
      - name: Resolve target status (dispatch input > persisted KV status > good)
        id: status
        working-directory: ocsp
        shell: bash
        env:
          INPUT_STATUS: ${{ inputs.status }}
          INPUT_TIME: ${{ inputs.revocation_time }}
          INPUT_REASON: ${{ inputs.revocation_reason }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deno run --allow-env --allow-read=. --allow-net=api.cloudflare.com \
            refresh-ops.ts resolve-status >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_OCSP_REFRESH_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Build, KMS-sign, and self-verify responses
        id: build
        continue-on-error: true
        working-directory: ocsp
        shell: bash
        env:
          STATUS: ${{ steps.status.outputs.status }}
          REVOCATION_TIME: ${{ steps.status.outputs.time }}
          REVOCATION_REASON: ${{ steps.status.outputs.reason }}
        run: |
          deno run --allow-read --allow-write --allow-env --allow-run=gcloud \
            build-ocsp-responses.ts --out-dir out --status "$STATUS" \
            --revocation-time "$REVOCATION_TIME" \
            --revocation-reason "$REVOCATION_REASON" \
            | tee /tmp/refresh-output.txt

      # Independent-implementation check before anything is published: openssl
      # must agree the responses verify and carry the expected status.
      - name: Cross-verify with openssl
        id: crossverify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          STATUS: ${{ steps.status.outputs.status }}
        run: |
          CERTS=verifier/trust-sources/realreel
          verify() {
            openssl ocsp -issuer "$CERTS/realreel-c2pa-root.pem" "$@" \
              -CAfile "$CERTS/realreel-c2pa-root.pem" -no_nonce 2>&1 \
              | tee -a /tmp/refresh-output.txt | tee /tmp/openssl-out.txt
            grep -q "Response verify OK" /tmp/openssl-out.txt
            grep -q ": $STATUS" /tmp/openssl-out.txt
          }
          verify -cert "$CERTS/realreel-claim-signing-ca.pem" \
            -respin ocsp/out/response-sha1.der
          verify -sha256 -cert "$CERTS/realreel-claim-signing-ca.pem" \
            -respin ocsp/out/response-sha256.der

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.crossverify.outcome == 'success'
        with:
          node-version: '24'

      - name: Publish to Workers KV
        id: publish
        if: steps.crossverify.outcome == 'success'
        continue-on-error: true
        working-directory: ocsp
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            npx wrangler@4 kv key put response:sha1 --path out/response-sha1.der \
              --binding OCSP_RESPONSES --remote
            npx wrangler@4 kv key put response:sha256 --path out/response-sha256.der \
              --binding OCSP_RESPONSES --remote
          } | tee -a /tmp/refresh-output.txt

      # Polls the live endpoint until POST and GET both serve bytes identical
      # to the response built above (see verify-live in ocsp/refresh-ops.ts) —
      # byte-equality proves the NEW response is being served through KV's
      # eventual consistency; a same-status stale response cannot pass.
      - name: Verify the live endpoint
        id: live
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        working-directory: ocsp
        shell: bash
        run: |
          deno run --allow-env --allow-read=.,../verifier \
            --allow-net=ocsp.realreel.xyz \
            refresh-ops.ts verify-live | tee -a /tmp/refresh-output.txt

      # Persist an explicitly dispatched status (to the ica-status KV key) so
      # scheduled runs keep re-signing it. Runs only after the live check
      # proves it published; a failure here is loud (issue + red run) because
      # losing it would let the next cron revert a revocation.
      - name: Persist published status
        id: persist
        if: steps.live.outcome == 'success' && steps.status.outputs.explicit == 'true'
        continue-on-error: true
        working-directory: ocsp
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STATUS: ${{ steps.status.outputs.status }}
          REVOCATION_TIME: ${{ steps.status.outputs.time }}
          REVOCATION_REASON: ${{ steps.status.outputs.reason }}
        run: |
          deno run --allow-env --allow-read=. --allow-net=api.cloudflare.com \
            refresh-ops.ts persist-status | tee -a /tmp/refresh-output.txt

      - name: Ensure tracking label exists
        if: >-
          always() &&
          (steps.status.outcome == 'failure' || steps.build.outcome == 'failure' ||
           steps.crossverify.outcome == 'failure' || steps.publish.outcome == 'failure' ||
           steps.live.outcome == 'failure' || steps.persist.outcome == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const label = { name: 'ocsp', color: 'D93F0B', description: 'OCSP responder operations' };
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, ...label });
            }

      - name: Open or comment on tracking issue
        if: >-
          always() &&
          (steps.status.outcome == 'failure' || steps.build.outcome == 'failure' ||
           steps.crossverify.outcome == 'failure' || steps.publish.outcome == 'failure' ||
           steps.live.outcome == 'failure' || steps.persist.outcome == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try { output = fs.readFileSync('/tmp/refresh-output.txt', 'utf-8'); } catch {}
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The OCSP refresh job failed. Pre-signed responses in KV keep serving until their',
              '`nextUpdate` (7-day window) — fix the refresh before it lapses or the responder goes stale.',
              'If the failed step is "Persist published status" after a status change, re-dispatch or write the',
              '`ica-status` KV key by hand before the next scheduled run re-signs the old status.',
              '', '```', output.trim() || '(no output captured)', '```', '',
              `Run: ${runUrl}`, '',
              'Runbook: `ocsp/README.md` § Refresh job.',
            ].join('\n');
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, labels: 'ocsp', state: 'open',
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, body: `Refresh re-run on ${today}:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `OCSP refresh failing (${today})`,
                labels: ['ocsp'], body,
              });
            }

      - name: Fail the run when any step failed
        if: >-
          always() &&
          (steps.status.outcome == 'failure' || steps.build.outcome == 'failure' ||
           steps.crossverify.outcome == 'failure' || steps.publish.outcome == 'failure' ||
           steps.live.outcome == 'failure' || steps.persist.outcome == 'failure')
        run: exit 1
