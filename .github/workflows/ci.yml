name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: trust-core + verifier (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Verifier tests read real C2PA media fixtures stored in Git LFS
          # (verifier/__tests__/fixtures/*.jpg|*.mov). Without lfs:true the
          # checkout leaves ~130-byte pointer files and the verify-*.test.ts
          # suites fail to parse them.
          lfs: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Installs all npm workspaces (trust-core, verifier, native) from the
      # root lockfile and links @realreel/c2pa-trust-core into the verifier.
      - name: Install dependencies
        run: npm ci

      # The two emit configs exclude __tests__/ so it never reaches dist/ —
      # which also left it checked by nothing. Same esbuild blind spot as the
      # verifier's test config below; this one is noEmit, so dist/ is unchanged.
      - name: trust-core — tsc (incl. tests)
        run: npx tsc -p tsconfig.test.json --noEmit
        working-directory: trust-core

      - name: trust-core — vitest
        run: npm test --workspace trust-core

      # Packs the tarball and asserts it is genuinely dual-format (CJS loads via
      # require + ESM via import + exports.require wired). Makes an ESM-only
      # regression — which broke jest consumers in 0.1.0 — impossible to publish.
      - name: trust-core — dual-format publish guard
        run: npm run verify:dual-format --workspace trust-core

      # Type-checks src/ only (production build).
      - name: verifier — tsc (src)
        run: npx tsc --noEmit
        working-directory: verifier

      # Type-checks __tests__/ + vitest.config.ts too. vitest transpiles with
      # esbuild, which strips types without checking them, so nothing else
      # catches a fixture drifting from the type it stands in for — Config,
      # TrustConfig and SignatureInfoShape had each grown a field the fixtures
      # never got. Gating it is what keeps that from silently recurring.
      - name: verifier — tsc (tests)
        run: npx tsc -p tsconfig.test.json --noEmit
        working-directory: verifier

      # ffprobe (from ffmpeg) is a hard dependency of the verifier: it
      # byte-probes the technical metadata of video uploads (see
      # src/derive-metadata.ts), and derive-metadata.test.ts probes a real MP4
      # fixture. ubuntu-latest doesn't ship ffmpeg by default.
      - name: Install ffmpeg (ffprobe)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # The crJSON conformance harness (verifier/src/harness/, tests in
      # verifier/__tests__/harness/) drives c2patool under libfaketime. Pin +
      # checksum mirror the Dockerfile's crjson-harness stage and are recorded
      # in verifier/CRJSON_HARNESS.md; CRJSON_HARNESS_REQUIRED=1 below turns "tools
      # missing" from a skip into a failure.
      - name: Install faketime + c2patool (crJSON harness)
        env:
          C2PATOOL_VERSION: 0.27.15
          C2PATOOL_SHA256: 7a035b727a6cdda8ad08d98fe94b3c20febee4aea4e7c1de02571b295730faf0
        run: |
          sudo apt-get install -y --no-install-recommends faketime
          curl -fsSL -o /tmp/c2patool.tar.gz \
            "https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v${C2PATOOL_VERSION}/c2patool-v${C2PATOOL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${C2PATOOL_SHA256}  /tmp/c2patool.tar.gz" | sha256sum -c -
          tar -xzf /tmp/c2patool.tar.gz -C /tmp
          sudo install -m 0755 /tmp/c2patool/c2patool /usr/local/bin/c2patool
          c2patool --version
          # faketime must actually steer the clock, not just be installed.
          [ "$(faketime -f '2031-01-01 00:00:00' date -u +%Y)" = "2031" ]

      - name: verifier — vitest
        run: npm test --workspace verifier
        env:
          CRJSON_HARNESS_REQUIRED: "1"

  ca:
    name: ca edge functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      # Mirrors the upstream `cd supabase && deno test --allow-read --allow-env
      # functions/` invocation. --allow-read loads the attestation fixture JSON
      # under _shared/attestation/__fixtures__/; --allow-env is read by cbor-x
      # at module init (CBOR_NATIVE_ACCELERATION_DISABLED).
      - name: ca — deno test
        run: deno test --allow-read --allow-env .
        working-directory: ca

  ocsp:
    name: ocsp Worker (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: ocsp — deno test
        run: deno test --allow-read .
        working-directory: ocsp

  ocsp-leaf:
    name: ocsp-leaf responder (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      # --allow-read reaches ../verifier/trust-sources/ (ICA + responder PEMs).
      - name: ocsp-leaf — deno test
        run: deno test --allow-read --allow-env -c deno.json .
        working-directory: ocsp-leaf

  # pki/ deploys as a Cloudflare Worker, but index.ts is only a thin wrapper
  # that hands wrangler's bundled PEMs to the pure router in router.ts — so the
  # routing, content-types and served bytes are all testable under Deno, the
  # same as the other edge services. --allow-read reaches
  # ../verifier/trust-sources/ (the canonical root + ICA PEMs the Worker
  # serves); router_test.ts pins their SHA-256 against the key ceremony.
  pki:
    name: pki Worker (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: pki — deno test
        run: deno test --allow-read .
        working-directory: pki

  # deno lint + deno fmt --check across every Deno service (ca, ocsp, ocsp-leaf,
  # pki). Deno's config is per-directory, so scripts/lint-deno.sh walks the
  # services rather than linting from the root — a root-level run would miss
  # each service's rule config. Formatting is scoped to TypeScript; the
  # markdown here is hand-wrapped and deno fmt reflows it.
  lint:
    name: deno lint + fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: deno lint + fmt --check
        run: scripts/lint-deno.sh

  workflows:
    name: workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable   # actionlint v1.7.12 needs go >= 1.25
          cache: false         # nothing to cache for a single `go install`

      # `go install` verifies the module against the public Go checksum
      # database — a version-pinned, supply-chain-checked install without
      # curl|bash or hand-maintained binary digests. shellcheck (preinstalled
      # on the runner) is picked up automatically for `run:` script linting.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint workflows
        run: |
          "$(go env GOPATH)/bin/actionlint" -color

  # The native Expo module (native/) ships Swift + Kotlin source for
  # transparency, but compiling it requires a full Expo/React Native app
  # (Xcode + Gradle + autolinking). Only the TypeScript bridge is checked
  # here; building the native targets is out of scope for this CI.
  native:
    name: native TS bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: native — tsc (TS bridge only)
        run: npx tsc --noEmit
        working-directory: native

      # --noEmit skips the output layout and `npm pack` doesn't build, so
      # `npm publish` was the only thing running the real emit.
      - name: native — expo-module build (the publish emit)
        run: npm run build --workspace native

      # The bridge normalizes every filesystem-path argument on its way into
      # Swift/Kotlin (src/mediaPath.ts). That conversion is pure TypeScript, so
      # it is testable here even though the native targets are not buildable.
      - name: native — vitest (TS bridge)
        run: npm test --workspace native

      # app.plugin.js requires ./plugin/build, but the expo-module publish
      # lifecycle builds the native module and not the config plugin. Pack the
      # tarball and assert plugin/build is present.
      - name: native — config-plugin packaging guard
        run: npm run verify:packaging --workspace native

      # The native code hardcodes the C2PA timestamp assertion label (it can't
      # import the TS constant); assert it still matches trust-core's canonical
      # TIMESTAMP_ASSERTION_LABEL so the invariant lives with the native source.
      - name: native — timestamp-label drift guard (vs trust-core)
        run: npm run check:native-labels --workspace native
